      { title: "Custom Video Guide", desc: "A video prepared on request, with explanations tailored to the investment topic you want to understand.", bullets: ["Choose your topic", "Structured video explanations", "Watch at your convenience"] },
      { title: "Investment Instrument Advertising", desc: "Promote investment instruments to an audience interested in finance, with clear information about features and risks.", bullets: ["Informative presentation", "Investment-minded audience", "Transparent communication"] },
      { title: "FAMILIA: 1,000,000 MDL for your child by age 18", desc: "A strategy with illustrative contribution and return calculations for targeting a 1,000,000 MDL portfolio by your child's 18th birthday. Outcomes depend on contributions and market performance and are not guaranteed.", bullets: ["Scenarios based on your child's age", "Estimated regular contributions and returns", "A long-term investment plan for your family"] }
    ]
  },
  portfolio: {
    title: "Moldinvest Public Portfolio", subtitle: "Data loaded from portfolio.json — no manual edits on the site.",
    kpi: { totalValue: "Total Portfolio Value", netPassiveIncome: "Net Passive Income", avgYield: "Weighted Average Yield" },
    columns: { ticker: "Ticker", company: "Company", quantity: "Quantity", avgPrice: "Avg Price", invested: "Invested", commission: "Commission", cost: "Cost", divGross: "Div Gross", divTaxes: "Div Taxes", divNet: "Div Net", divYield: "Div Yield %", code: "Code", price: "Price", yield: "Yield %", issued: "Issued", maturity: "Maturity", days: "Days", interest: "Interest", sold: "Sold" },
    tier1: { title: "Moldovan Stocks", company: "Company", shares: "Shares", avgPrice: "Avg. Price (MDL)", currentPrice: "Current Price (MDL)", totalValue: "Total Value (MDL)", dividends: "Dividends Received (MDL)", totalReturn: "Total Return (%)" },
    tier2: { title: "Government Bonds", issue: "Issue / Maturity", invested: "Amount Invested (MDL)", couponRate: "Coupon Rate (%)", frequency: "Payment Frequency", couponReceived: "Coupon Received (MDL)", projectedIncome: "Projected Annual Income (MDL)" },
    empty: "No portfolio data has been uploaded yet."
  },
  footer: { rights: "All rights reserved.", disclaimer: "The information presented is for educational purposes only and does not constitute personalized investment advice under Moldovan capital market legislation.", address: "Chișinău, Republic of Moldova" }
}
};

let currentLang = localStorage.getItem("moldinvest_lang") || "ro";
let portfolioData = { stocks: [], bonds: [] };
const NET_PASSIVE_INCOME = 4789.68;

function get(obj, path) {
  return path.split(".").reduce((a, k) => (a && a[k] !== undefined ? a[k] : undefined), obj);
}

function fmtMDL(v) {
  return (Number(v) || 0).toLocaleString("ro-MD", { maximumFractionDigits: 2 }) + " MDL";
}
function fmtPct(v) {
  return (Number(v) || 0).toLocaleString("ro-MD", { maximumFractionDigits: 2 }) + "%";
}
function fmtRatioPct(v) {
  return ((Number(v) || 0) * 100).toLocaleString("ro-MD", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
}

function renderLangSwitch() {
  const langs = ["ro", "ru", "en"];
  const labels = { ro: "RO", ru: "RU", en: "EN" };
  const html = langs.map(code => `
    <button type="button" data-lang="${code}"
      class="lang-btn px-2.5 py-1 text-xs font-semibold rounded-full transition-colors ${currentLang === code ? 'bg-brand-blue text-white shadow-sm' : 'text-slate-500 hover:text-brand-blue'}">
      ${labels[code]}
    </button>`).join("");
  document.getElementById("lang-switch").innerHTML = html;
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem("moldinvest_lang", currentLang);
      renderAll();
    });
  });
}

function renderText() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const val = get(DICTIONARIES[currentLang], el.dataset.i18n);
    if (typeof val === "string") el.textContent = val;
  });
}

function renderServices() {
  const dict = DICTIONARIES[currentLang].services;
  const icons = ["🧑‍💼", "👥", "📋", "🎥", "📣", "👨‍👩‍👧‍👦"];
  const grid = document.getElementById("services-grid");
  grid.innerHTML = dict.items.map((s, i) => `
    <div class="flex flex-col rounded-2xl border border-slate-100 bg-surface-light p-7 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-blue text-white mb-5 text-xl">${icons[i]}</span>
      <h3 class="text-lg font-bold text-navy">${s.title}</h3>
      <p class="mt-3 text-sm text-slate-600 flex-1">${s.desc}</p>
      <ul class="mt-4 space-y-2">
        ${s.bullets.map(b => `<li class="flex items-start gap-2 text-sm text-slate-600"><span class="text-brand-emerald mt-0.5">✓</span>${b}</li>`).join("")}
      </ul>
    </div>
  `).join("");
}

function computeKpis() {
  const stocks = portfolioData.stocks || [];
  const bonds = portfolioData.bonds || [];
  const stocksValue = stocks.reduce((s, x) => s + (Number(x.invested) || 0), 0);
  const bondsValue = bonds.reduce((s, x) => s + (Number(x.invested) || 0), 0);
  const totalValue = stocksValue + bondsValue;
  const bondsAnnualIncome = bonds.reduce((s, b) => s + (Number(b.invested) || 0) * (Number(b.yield) || 0), 0);
  const stocksDivNet = stocks.reduce((s, x) => s + (Number(x.divNet) || 0), 0);
  const avgYield = totalValue > 0 ? ((stocksDivNet + bondsAnnualIncome) / totalValue) * 100 : 0;
  return { totalValue, avgYield };
}

function stockReturn(s) {
  const cost = (Number(s.actiuni) || 0) * (Number(s.pretMediu) || 0);
  const value = (Number(s.actiuni) || 0) * (Number(s.pretCurent) || 0);
  const div = Number(s.dividendeIncasate) || 0;
  if (cost <= 0) return 0;
  return ((value - cost + div) / cost) * 100;
}

function renderPortfolio() {
  const dict = DICTIONARIES[currentLang].portfolio;
  const kpi = computeKpis();
  document.getElementById("kpi-total").textContent = fmtMDL(kpi.totalValue);
  document.getElementById("kpi-income").textContent = fmtMDL(NET_PASSIVE_INCOME);
  document.getElementById("kpi-yield").textContent = fmtPct(kpi.avgYield);

  const stocks = portfolioData.stocks || [];
  const stocksBody = document.getElementById("stocks-tbody");
  stocksBody.innerHTML = stocks.length === 0
    ? `<tr><td colspan="11" class="px-4 py-6 text-center text-slate-400">${dict.empty}</td></tr>`
    : stocks.map(s => {
        return `<tr class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-medium text-navy">${s.ticker}</td>
          <td class="px-4 py-3">${s.company}</td>
          <td class="px-4 py-3 text-right">${s.quantity}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.avgPrice)}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.invested)}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.commission)}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.cost)}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.divGross)}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.divTaxes)}</td>
          <td class="px-4 py-3 text-right font-semibold">${fmtMDL(s.divNet)}</td>
          <td class="px-4 py-3 text-right font-semibold text-brand-emerald">${fmtRatioPct(s.divYield)}</td>
        </tr>`;
      }).join("");

  const bonds = portfolioData.bonds || [];
  const bondsBody = document.getElementById("bonds-tbody");
  bondsBody.innerHTML = bonds.length === 0
    ? `<tr><td colspan="10" class="px-4 py-6 text-center text-slate-400">${dict.empty}</td></tr>`
    : bonds.map(b => {
        return `<tr class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-medium text-navy">${b.code}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(b.price)}</td>
          <td class="px-4 py-3 text-right">${b.quantity}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(b.invested)}</td>
          <td class="px-4 py-3 text-right">${fmtRatioPct(b.yield)}</td>
          <td class="px-4 py-3">${b.issued}</td>
          <td class="px-4 py-3">${b.maturity}</td>
          <td class="px-4 py-3 text-right">${b.days}</td>
          <td class="px-4 py-3 text-right">${typeof b.interest === "number" ? fmtMDL(b.interest) : b.interest || "-"}</td>
          <td class="px-4 py-3">${b.sold || "-"}</td>
        </tr>`;
      }).join("");
}

function animateStats() {
  const targets = { "stat-community": 3000, "stat-portfolio": 18257.8 };
  const suffixes = { "stat-community": "+", "stat-portfolio": " MDL" };
  Object.entries(targets).forEach(([id, target]) => {
    const el = document.getElementById(id);
    let start = null;
    const duration = 1500;
    function step(ts) {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const value = id === "stat-portfolio" ? Math.round(progress * target * 10) / 10 : Math.floor(progress * target);
      el.textContent = value.toLocaleString("ro-MD", { maximumFractionDigits: 1 }) + suffixes[id];
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function renderAll() {
  renderLangSwitch();
  renderText();
  renderServices();
  renderPortfolio();
}

document.getElementById("footer-year").textContent = new Date().getFullYear();

// Load portfolio.json (must be served over http/https — file:// will fail
// due to browser fetch restrictions; use `vercel dev`, `npx serve`, or just
// deploy to Vercel to test).
fetch("./portfolio.json")
  .then(r => r.json())
  .then(data => { portfolioData = data; renderAll(); animateStats(); })
  .catch(err => {
    console.error("Nu s-a putut încărca portfolio.json:", err);
    renderAll();
    animateStats();
  });
</script>
</body>
</html>
