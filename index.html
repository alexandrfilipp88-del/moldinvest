let currentLang = "ro";
const NUMBER_LOCALES = { ro: "ro-MD", ru: "ru-MD" };
let portfolioData = { stocks: [], bonds: [] };
const NET_PASSIVE_INCOME = 4789.68;
let investmentChart = null;

function get(obj, path) {
  return path.split(".").reduce((a, k) => (a && a[k] !== undefined ? a[k] : undefined), obj);
}

function fmtMDL(v) {
  return (Number(v) || 0).toLocaleString(NUMBER_LOCALES[currentLang], { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " MDL";
}
function fmtTableAmount(v) {
  return (Number(v) || 0).toLocaleString(NUMBER_LOCALES[currentLang], { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(v) {
  return (Number(v) || 0).toLocaleString(NUMBER_LOCALES[currentLang], { maximumFractionDigits: 2 }) + "%";
}
function fmtRatioPct(v) {
  return ((Number(v) || 0) * 100).toLocaleString(NUMBER_LOCALES[currentLang], { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
}

function computeKpis() {
  const stocks = portfolioData.stocks || [];
  const bonds = portfolioData.bonds || [];
  const stocksValue = stocks.reduce((s, x) => s + (Number(x.invested) || 0), 0);
  const bondsValue = bonds.reduce((s, x) => s + (Number(x.invested) || 0), 0);
  const totalValue = stocksValue + bondsValue;
  const bondsAnnualIncome = bonds.reduce((s, b) => s + (Number(b.invested) || 0) * (Number(b.yield) || 0), 0);
  const stocksDivNet = stocks.reduce((s, x) => s + (Number(x.divNet) || 0), 0);
  const avgYield = totalValue > 0 ? ((stocksDivNet + bondsAnnualIncome) / totalValue) * 100 : 0;
  return { totalValue, avgYield };
}

function stockReturn(s) {
  const cost = (Number(s.actiuni) || 0) * (Number(s.pretMediu) || 0);
  const value = (Number(s.actiuni) || 0) * (Number(s.pretCurent) || 0);
  const div = Number(s.dividendeIncasate) || 0;
  if (cost <= 0) return 0;
  return ((value - cost + div) / cost) * 100;
}

function renderPortfolio() {
  const dict = DICTIONARIES[currentLang].portfolio;
  const updatedAt = portfolioData.updatedAt;
  const updatedAtElement = document.getElementById("portfolio-updated-at");
  if (typeof updatedAt === "string" && /^\d{4}-\d{2}-\d{2}$/.test(updatedAt)) {
    const parsedDate = new Date(`${updatedAt}T00:00:00Z`);
    if (!Number.isNaN(parsedDate.getTime()) && parsedDate.toISOString().slice(0, 10) === updatedAt) {
      const locale = NUMBER_LOCALES[currentLang];
      updatedAtElement.dateTime = updatedAt;
      updatedAtElement.textContent = parsedDate.toLocaleDateString(locale, {
        day: "numeric",
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      }).replace(/\.$/, "");
    } else {
      updatedAtElement.removeAttribute("datetime");
      updatedAtElement.textContent = dict.updatedUnavailable;
    }
  } else {
    updatedAtElement.removeAttribute("datetime");
    updatedAtElement.textContent = dict.updatedUnavailable;
  }
  const kpi = computeKpis();
  document.getElementById("kpi-total").textContent = fmtMDL(kpi.totalValue);
  document.getElementById("kpi-income").textContent = fmtMDL(NET_PASSIVE_INCOME);
  document.getElementById("kpi-yield").textContent = fmtPct(kpi.avgYield);

function calculatorMoney(value) {
  if (!Number.isFinite(value)) return "—";
  return new Intl.NumberFormat(NUMBER_LOCALES[currentLang], { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value) + " MDL";
}

function renderCalculator() {
  const dict = DICTIONARIES[currentLang].calculator;
  const initial = Math.max(0, Number.parseFloat(document.getElementById("calc-initial").value) || 0);
  const monthly = Math.max(0, Number.parseFloat(document.getElementById("calc-monthly").value) || 0);
  const rate = Math.max(0, Number.parseFloat(document.getElementById("calc-rate").value) || 0);
  const requestedMonths = Number.parseFloat(document.getElementById("calc-months").value);
  const months = Number.isFinite(requestedMonths) && requestedMonths >= 0
    ? Math.min(1200, Math.floor(requestedMonths))
    : 0;
  const taxRate = Math.min(100, Math.max(0, Number.parseFloat(document.getElementById("calc-tax").value) || 0));
  document.getElementById("calc-months").value = months;

  const monthlyRate = rate / 100 / 12;
  let balance = initial;
  const labels = [0];
  const investedSeries = [initial];
  const gainSeries = [0];
  let overflowed = !Number.isFinite(balance);

  for (let month = 1; month <= months && !overflowed; month++) {
    balance = balance * (1 + monthlyRate) + monthly;
    if (!Number.isFinite(balance)) {
      overflowed = true;
      break;
    }
    const invested = initial + monthly * month;
    const grossGain = Math.max(0, balance - invested);
    labels.push(month);
    investedSeries.push(invested);
    gainSeries.push(grossGain * (1 - taxRate / 100));
  }

  const totalInvested = initial + monthly * months;
  const grossGain = Math.max(0, balance - totalInvested);
  const taxAmount = grossGain * taxRate / 100;
  const resultValues = {
    "calc-result-invested": totalInvested,
    "calc-result-gain": grossGain,
    "calc-result-tax": taxAmount,
    "calc-result-final": balance - taxAmount
  };
  Object.entries(resultValues).forEach(([id, value]) => {
    document.getElementById(id).textContent = calculatorMoney(value);
  });

  const useYears = months > 24;
  const tickStep = useYears ? 12 * Math.max(1, Math.ceil(months / 12 / 6)) : Math.max(1, Math.ceil(months / 6));
  document.getElementById("calc-axis-note").textContent = useYears ? dict.axisYears : dict.axisMonths;
  const error = document.getElementById("calc-error");
  error.classList.toggle("hidden", !overflowed && typeof Chart !== "undefined");
  if (overflowed) error.textContent = dict.error;
  else if (typeof Chart === "undefined") error.textContent = dict.chartUnavailable;

  if (typeof Chart === "undefined" || overflowed) {
    if (overflowed && investmentChart) {
      investmentChart.data = { labels: [], datasets: [] };
      investmentChart.update();
    }
    return;
  }

  const chartData = {
    labels,
    datasets: [
      { label: dict.invested, data: investedSeries, backgroundColor: "#64748B", borderWidth: 0, barPercentage: 1, categoryPercentage: 0.95 },
      { label: dict.netGain, data: gainSeries, backgroundColor: "#059669", borderWidth: 0, barPercentage: 1, categoryPercentage: 0.95 }
    ]
  };

  if (!investmentChart) {
    investmentChart = new Chart(document.getElementById("investment-chart"), {
      type: "bar",
      data: chartData,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: items => `${dict.chartMonth} ${items[0].label}`,
              label: item => `${item.dataset.label}: ${calculatorMoney(item.parsed.y)}`,
              footer: items => `${dict.finalValueTooltip}: ${calculatorMoney(items.reduce((sum, item) => sum + item.parsed.y, 0))}`
            }
          }
        },
        scales: {
          x: {
            stacked: true,
            grid: { display: false },
            ticks: {
              autoSkip: false,
              maxRotation: 0,
              color: "#64748B",
              font: { size: 11 },
              callback: function(value) {
                const month = Number(this.getLabelForValue(value));
                if (month % tickStep !== 0) return "";
                return useYears ? month / 12 : month;
              }
            }
          },
          y: {
            stacked: true,
            beginAtZero: true,
            grid: { color: "rgba(100,116,139,0.16)" },
            ticks: {
              color: "#64748B",
              font: { size: 11 },
              maxTicksLimit: 5,
              callback: value => new Intl.NumberFormat(
                NUMBER_LOCALES[currentLang],
                { minimumFractionDigits: 2, maximumFractionDigits: 2 }
              ).format(value)
            }
          }
        }
      }
    });
  } else {
    investmentChart.data = chartData;
    investmentChart.options.plugins.tooltip.callbacks = {
      title: items => `${dict.chartMonth} ${items[0].label}`,
      label: item => `${item.dataset.label}: ${calculatorMoney(item.parsed.y)}`,
      footer: items => `${dict.finalValueTooltip}: ${calculatorMoney(items.reduce((sum, item) => sum + item.parsed.y, 0))}`
    };
    investmentChart.options.scales.x.ticks.callback = function(value) {
      const month = Number(this.getLabelForValue(value));
      if (month % tickStep !== 0) return "";
      return useYears ? month / 12 : month;
    };
    investmentChart.update();
  }
}

function renderStats() {
  const targets = { "stat-community": 3000, "stat-portfolio": 18257.8 };
  const suffixes = { "stat-community": "+", "stat-portfolio": " MDL" };
  Object.entries(targets).forEach(([id, target]) => {
    const value = id === "stat-portfolio" ? target : Math.floor(target);
    const options = id === "stat-portfolio"
      ? { minimumFractionDigits: 2, maximumFractionDigits: 2 }
      : { maximumFractionDigits: 0 };
    document.getElementById(id).textContent = value.toLocaleString(NUMBER_LOCALES[currentLang], options) + suffixes[id];
  });
}

function animateStats() {
  const targets = { "stat-community": 3000, "stat-portfolio": 18257.8 };
  const suffixes = { "stat-community": "+", "stat-portfolio": " MDL" };
  Object.entries(targets).forEach(([id, target]) => {
    const el = document.getElementById(id);
    let start = null;
    const duration = 1500;
    function step(ts) {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const value = id === "stat-portfolio" ? Math.round(progress * target * 10) / 10 : Math.floor(progress * target);
      const options = id === "stat-portfolio"
        ? { minimumFractionDigits: 2, maximumFractionDigits: 2 }
        : { maximumFractionDigits: 0 };
      el.textContent = value.toLocaleString(NUMBER_LOCALES[currentLang], options) + suffixes[id];
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function renderAll() {
  renderLangSwitch();
  renderText();
  renderStats();
  renderServices();
  renderFaq();
  renderPortfolio();
  updateTableScrollHints();
  renderCalculator();
}

function updateTableScrollHints() {
  document.querySelectorAll("[data-table-scroll]").forEach(table => {
    const hint = table.nextElementSibling;
    if (hint) hint.hidden = table.scrollWidth <= table.clientWidth;
  });
}

["calc-initial", "calc-monthly", "calc-rate", "calc-months", "calc-tax"].forEach(id => {
  document.getElementById(id).addEventListener("input", renderCalculator);
});

fetch("./portfolio.json")

  .then(data => { portfolioData = data; renderAll(); animateStats(); })
  .catch(err => {
    console.error("Nu s-a putut încărca portfolio.json:", err);
    renderAll();
    animateStats();
